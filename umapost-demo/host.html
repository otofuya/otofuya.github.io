<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>うまポスト デモ｜進行</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=M+PLUS+Rounded+1c:wght@400;700;800&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body class="host">
<div class="hostwrap">
  <h2 style="font-size:26px">進行ボタン</h2>
  <div id="warn"></div>
  <div class="status"><div><b id="sStage">…</b><small>いまの場面</small></div><div><b id="sCount">0</b><small>参加人数</small></div><div><b id="sTickets">0</b><small>このレースの馬券</small></div></div>
  <button class="btn green" data-go="lobby">① 受付（QRを出す）</button>
  <button class="btn green" data-go="bet">② 予想スタート</button>
  <button class="btn green" data-go="race">③ レース開始</button>
  <button class="btn green" data-go="result">④ 結果発表</button>
  <button class="btn" data-go="free">⑤ 自由タイム開始</button>
  <button class="btn ghost" data-go="stopfree">自由タイムを止めて受付に戻す</button>
  <button class="btn ghost" data-go="reset" style="color:#D2352B">全部消して最初から</button>
  <div class="links" id="links"></div>
</div>
<div id="toast"></div>
<script src="js/config.js"></script>
<script src="js/vendor/supabase.js"></script>
<script src="js/common.js"></script>
<script src="js/net.js"></script>
<script src="js/host.js"></script>
</body>
</html>
